# Canal al que saltar al arrancar.
#
# Hace falta un trigger y no vale weechat.startup.command_after_plugins: los
# buffers de Slack no existen hasta que wee-slack termina de conectar, que es
# asíncrono. El trigger reacciona a la apertura del buffer.
/trigger del slack_default_buffer
/trigger add slack_default_buffer signal buffer_opened "${buffer[${tg_signal_data}].full_name} == python.slack.@WORKSPACE@.@CHANNEL@" "" "/buffer python.slack.@WORKSPACE@.@CHANNEL@"
