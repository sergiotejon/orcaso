# Configuración de WeeChat para wee-slack.
#
# Un comando de WeeChat por línea. Las líneas vacías y las que empiezan por '#'
# se ignoran. install.sh sustituye los marcadores y manda el resultado a WeeChat
# (por su FIFO si está corriendo, o arrancándolo en efímero si no).
#
# Marcadores:
#   @REPO@       ruta absoluta de este repositorio
#   @WORKSPACE@  nombre del workspace de Slack
#   @CHANNEL@    canal por defecto, con su prefijo (# público, & privado)

# ----------------------------------------------------------------- navegación
# Alt+g abre el saltador de buffers de go.py (buscar canal por nombre).
# Ctrl+g hace lo mismo: en macOS muchos terminales no mandan Option como Meta,
# así que Alt+<letra> puede no llegar nunca a WeeChat. (El tercer camino,
# siempre disponible, es pulsar Esc y luego la letra.)
/key bind meta-g /go
/key bind ctrl-g /go

# Ctrl+v = "volver": salta al buffer visitado anteriormente. Es como se sale de
# un hilo, porque los buffers de hilo se crean al final de la lista y no junto a
# su canal. Equivale a Alt+< (o Esc <), que en macOS puede no llegar.
/key bind ctrl-v /buffer jump prev_visited

# go.py muestra las coincidencias en horizontal, en la línea de entrada. Con
# nombres cortos, sin el número de buffer y sin listar nada hasta el segundo
# carácter, la lista cabe y se lee.
/set plugins.var.python.go.short_name on
/set plugins.var.python.go.buffer_number off
/set plugins.var.python.go.fuzzy_search on
/set plugins.var.python.go.min_chars 2

# Barra de completado en vertical, una opción por línea. Aparece sola al pulsar
# Tab (size 0 = se ajusta al contenido, así que mide 0 cuando no hay nada) y
# sirve para todo: /buffer <parte><Tab>, nicks, emoji, comandos.
/bar del complist
/bar add complist window bottom 0 0 completion
/bar set complist filling_top_bottom vertical
/bar set complist size_max 12

# --------------------------------------------------------------------- ratón
/mouse enable
# Ctrl/Alt + clic sobre un mensaje abre su hilo (el clic derecho, que pega el id
# del mensaje, lo define wee-slack por su cuenta)
/key bindctxt mouse @chat(python.*):ctrl-button1 hsignal:slack_focus_thread
/key bindctxt mouse @chat(python.*):alt-button1 hsignal:slack_focus_thread

# ----------------------------------------------------------------- apariencia
# Los nombres de canal y los nicks largos de Slack no se comen la pantalla
/bar set buflist size_max 25
/set weechat.look.prefix_align_max 15
# La lista de integrantes del canal, oculta (Alt+Shift+n para verla)
/set weechat.bar.nicklist.hidden on

# ---------------------------------------------------------------- privacidad
# WeeChat registra por defecto todas las conversaciones en texto plano, un
# fichero por canal, en ~/.local/share/weechat/logs/. Es contenido de la empresa
# sin cifrar en el disco, así que se desactiva.
/set logger.file.auto_log off

# ------------------------------------------------------------------ wee-slack
/set slack.look.display_reaction_nicks on

# ------------------------------------------------------------ imágenes y GIFs
# /imgurl <url|fichero> [ancho] [alto]  ->  arte ANSI dentro de un buffer
#   -nf   buffer nuevo de contenido libre (sin ajuste de línea)
#   -cl   lo limpia en cada imagen        -noln  sin números de línea
#   -color weechat  convierte los códigos ANSI (ojo: 'ansi' los deja tal cual)
#   NUNCA -o: enviaría el dibujo al canal como si lo hubieras escrito
/alias del imgurl
/alias add imgurl /exec -nf -cl -noln -color weechat -name img @REPO@/bin/slack-img $*
# /img <n> y /gif <n> usan los hints ¹²³ que pone url_hint.py
/alias del img
/alias add img /url_hint_replace /imgurl {url$1}
/alias del gif
/alias add gif /url_hint_replace /exec -bg @REPO@/bin/slack-open {url$1}
/key bind meta-i /img 1
/key bind meta-o /gif 1
